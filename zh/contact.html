          </div>
          <div class="field full"><label>留言 *</label><textarea name="message" rows="5" required placeholder="请告知颜色、规格、数量、目标市场..."></textarea></div>

<style>
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#25D366;color:#fff;padding:12px 24px;border-radius:8px;font-size:15px;z-index:9999;opacity:0;pointer-events:none;transition:opacity .3s;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.toast.show{opacity:1}
.toast.error{background:#ef4444}
</style>
<script>
(function(){
  var f=document.getElementById('inquiry-form');
  if(!f)return;
  f.addEventListener('submit',function(e){
    e.preventDefault();
    var msg='*来自 GONGDA 官网的新询盘*%0A%0A';
    msg+='姓名: '+encodeURIComponent(f.name.value)+'%0A';
    msg+='公司: '+encodeURIComponent(f.company.value)+'%0A';
    msg+='邮箱: '+encodeURIComponent(f.email.value)+'%0A';
    msg+='电话: '+encodeURIComponent(f.phone.value||'—')+'%0A';
    msg+='产品意向: '+encodeURIComponent(f.product.value)+'%0A';
    msg+='留言: '+encodeURIComponent(f.message.value)+'%0A%0A';
    msg+='--- 通过 gongdaa.com 发送 ---';
    var t=document.getElementById('toast');
    var b=f.querySelector('button[type=submit]');
    var o=b.textContent;
    b.textContent='正在打开 WhatsApp...';
    b.disabled=true;
    t.className='toast show';
    t.textContent='正在打开 WhatsApp — 发送消息即可完成询盘 ✓';
    window.open('https://wa.me/8613532762231?text='+msg,'_blank');
    setTimeout(function(){b.textContent=o;b.disabled=false;t.className='toast'},3000);
  });
})();
</script>
